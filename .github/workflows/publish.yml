# Publication automatique sur Modrinth + CurseForge à chaque release GitHub.
# Secrets requis (Settings → Secrets → Actions) : MODRINTH_TOKEN, CURSEFORGE_TOKEN.
# Variable requise (Settings → Variables → Actions) : CURSEFORGE_ID (id numérique du projet).
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Read version
        id: v
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Changelog for this version
        id: cl
        run: |
          {
            echo 'body<<EOF'
            awk -v v="${{ steps.v.outputs.version }}" '
              $0 ~ "^## " v { on=1; next }
              /^## / && on { exit }
              on { print }' CHANGELOG.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth + CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: build/libs/!(*-sources).jar
          name: SnkMC Essentials ${{ steps.v.outputs.version }}
          version: ${{ steps.v.outputs.version }}
          version-type: release
          changelog: ${{ steps.cl.outputs.body }}
          loaders: fabric
          game-versions: 26.1.2
          java: 25
          dependencies: fabric-api(required)

          modrinth-id: snkmc-essentials
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: v${{ steps.v.outputs.version }}
